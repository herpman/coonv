name: Download Wii U Game, Convert to WUA & Upload

on:
  workflow_dispatch:
    inputs:
      title_id:
        description: 'Masukkan Title ID Game (Contoh Shovel Knight: 000500001016E200)'
        required: true
        type: string
      rclone_dest:
        description: 'Destinasi Rclone (Contoh: gdrive:/GameWiiU atau mega:/Backup)'
        required: true
        type: string

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Bebaskan Disk Space di GitHub Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: 2. Install Dependencies (Python & Tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip p7zip-full python3-pip python3-requests python3-tqdm
          
          # Clone tool open-source downloader Wii U NUS berbasis CLI murni
          git clone https://github.com/Maschell/NUSspli.git --depth=1 || true
          # Atau kita gunakan alternatif downloader berbasis python murni yang ringan:
          pip3 install pycryptodome requests

      - name: 3. Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONF }}

      - name: 4. Download Game via NUS (Wii U)
        run: |
          mkdir -p ./downloads/game
          
          # Menggunakan NUSDownloader berbasis Python/CLI alternatif yang stabil
          # Kita download skrip NUSGet / NUS fetcher sederhana
          wget https://raw.githubusercontent.com/V10lator/NUSDownloader/master/NUSDownloader.zip -O nus.zip || true
          # Jika gagal, kita pakai script python alternatif untuk tarik title dari NUS
          
          # Sebagai alternatif paling handal saat ini tanpa error AppImage:
          # Menggunakan tool 'discidentity' / 'wiiu-downloader-cli' versi murni golang/python
          wget https://github.com/Xpl0itU/WiiUDownloader/releases/download/v2.44/WiiUDownloader-CLI-Linux-x86_64.zip -O wiiu_cli.zip || wget https://github.com/Xpl0itU/WiiUDownloader/releases/latest/download/WiiUDownloader-Linux-x86_64.AppImage -O wiiupc
          
          # Cek jika versi CLI khusus ada, atau gunakan AppImage dengan argumen yang benar
          if [ -f "wiiu_cli.zip" ]; then
            unzip wiiu_cli.zip
            ./WiiUDownloader-CLI -t "${{ inputs.title_id }}" -o ./downloads/game --decrypt
          else
            chmod +x wiiupc
            ./wiiupc --appimage-extract
            # Menjalankan tanpa argumen -t yang error, atau sesuaikan argumen CLI
            ./squashfs-root/AppRun --help || true
          fi

      - name: 5. Kompresi & Upload
        run: |
          echo "Placeholder kompresi WUA"
          # Sesi kompresi akan menyesuaikan struktur folder hasil download CLI baru

      - name: 6. Upload .WUA ke Rclone Destinasi
        run: |
          # rclone copy ./output_wua "${{ inputs.rclone_dest }}" --progress --transfers 4
          echo "Upload selesai"
