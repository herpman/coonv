name: Download Wii U Game, Convert to WUA & Upload

on:
  workflow_dispatch:
    inputs:
      title_id:
        description: 'Masukkan Title ID Game (Contoh Shovel Knight: 000500001016E200)'
        required: true
        default: '000500001016E200'
        type: string
      rclone_dest:
        description: 'Destinasi Rclone (Contoh: gdrive:/GameWiiU atau mega:/Backup)'
        required: true
        type: string
      download_dlc_updates:
        description: 'Download Update & DLC sekaligus?'
        required: true
        type: boolean
        default: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Bebaskan Disk Space di GitHub Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: 2. Install Dependencies & Virtual Display
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip p7zip-full xvfb

      - name: 3. Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONF }}

      - name: 4. Download Game Wii U via Wii U Downloader
        run: |
          mkdir -p ./downloads
          EXTRA_FLAGS=""
          if [ "${{ inputs.download_dlc_updates }}" = "true" ]; then
            EXTRA_FLAGS="--dlc --update"
          fi
          
          # Download Wii U Downloader AppImage terbaru
          wget https://github.com/Xpl0itU/WiiUDownloader/releases/latest/download/WiiUDownloader-Linux-x86_64.AppImage -O wiiupc
          chmod +x wiiupc
          
          # Ekstrak dan jalankan unduhan
          ./wiiupc --appimage-extract
          xvfb-run ./squashfs-root/AppRun -t "${{ inputs.title_id }}" -o ./downloads $EXTRA_FLAGS --decrypt

      - name: 5. Kompresi Folder ke Format .WUA Murni
        run: |
          mkdir -p ./output_wua
          
          # Download Cemu versi Linux stabil langsung dari rilis resmi
          wget https://github.com/cemu-project/Cemu/releases/download/v2.0/Cemu-2.0-linux-x86_64.AppImage -O cemu_stable || wget https://github.com/cemu-project/Cemu/releases/download/v2.6/Cemu-2.6-linux-x86_64.AppImage -O cemu_stable || true
          
          # Jika gagal, ambil mirror lain yang kompatibel
          if [ ! -f "cemu_stable" ] || [ ! -s "cemu_stable" ]; then
            wget https://github.com/cemu-project/Cemu/releases/download/v2.0/Cemu-2.0-ubuntu-20.04.AppImage -O cemu_stable
          fi
          
          chmod +x cemu_stable
          ./cemu_stable --appimage-extract
          
          # Proses kompresi folder hasil download menjadi file tunggal .wua
          for dir in ./downloads/*/; do
            if [ -d "$dir" ]; then
              dirname=$(basename "$dir")
              echo "Mengompres folder $dirname menjadi file .wua..."
              ./squashfs-root/AppRun --compress-title "$dir" -o "./output_wua/${dirname}.wua"
              # Hapus folder mentah setelah sukses jadi .wua agar hemat disk
              rm -rf "$dir"
            fi
          done

      - name: 6. Upload .WUA ke Rclone Destinasi
        run: |
          rclone copy ./output_wua "${{ inputs.rclone_dest }}" --progress --transfers 4

      - name: 7. Bersihkan Sisa File Runner
        run: rm -rf ./output_wua downloads squashfs-root cemu_stable wiiupc
