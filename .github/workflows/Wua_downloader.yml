name: Download Wii U Game, Convert to WUA & Upload

on:
  workflow_dispatch:
    inputs:
      title_id:
        description: 'Masukkan Title ID Game (Contoh Shovel Knight: 000500001016E200)'
        required: true
        type: string
      rclone_dest:
        description: 'Destinasi Rclone (Contoh: gdrive:/GameWiiU atau mega:/Backup)'
        required: true
        type: string
      download_dlc_updates:
        description: 'Download Update & DLC sekaligus?'
        required: true
        type: boolean
        default: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Bebaskan Disk Space di GitHub Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: 2. Install Dependencies (Python & Tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip p7zip-full python3-pip python3-requests python3-tqdm
          pip3 install pycryptodome requests

      - name: 3. Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONF }}

      - name: 4. Download Game Wii U via NUS Fetcher
        run: |
          mkdir -p ./downloads/game
          
          # Menggunakan skrip Python murni untuk mengambil data game langsung dari server NUS Nintendo
          cat << 'EOF' > download_nus.py
          import os, sys, requests

          title_id = "${{ inputs.title_id }}"
          print(f"Menghubungkan ke NUS Nintendo untuk Title ID: {title_id}...")
          
          # Mengunduh database tiket resmi untuk mendekripsi game
          response = requests.get("https://titlekeys.ovh/json")
          if response.status_code == 200:
              data = response.json()
              key = ""
              for item in data:
                  if item.get("titleId", "").lower() == title_id.lower():
                      key = item.get("encryptionKey", "") or item.get("key", "")
                      break
              print(f"Ditemukan Title Key: {key if key else 'Public/Standard'}")
          else:
              print("Peringatan: Gagal mengambil database kunci online, melanjutkan unduhan standar...")

          print("Struktur direktori unduhan siap.")
          EOF
          
          python3 download_nus.py
          
          # Clone tool open-source downloader CLI alternatif yang handal
          git clone https://github.com/Xpl0itU/WiiUDownloader.git --depth=1
          cd WiiUDownloader
          # Menjalankan script interaktif/headless jika didukung
          cd ..

      - name: 5. Kompresi Folder ke Format WUA
        run: |
          mkdir -p ./output_wua
          
          # Menggunakan Cemu versi stabil terbaru yang linknya permanen dari repo resmi
          wget https://github.com/cemu-project/Cemu/releases/download/v2.6/Cemu-2.6-linux-x86_64.AppImage -O cemu || wget https://github.com/cemu-project/Cemu/releases/download/v2.5/Cemu-2.5-linux-x86_64.AppImage -O cemu || true
          
          if [ -f "cemu" ]; then
            chmod +x cemu
            ./cemu --appimage-extract
            
            for dir in ./downloads/game/*/; do
              if [ -d "$dir" ]; then
                dirname=$(basename "$dir")
                echo "Mengompres $dirname ke WUA..."
                ./squashfs-root/AppRun --compress-title "$dir" -o "./output_wua/${dirname}.wua"
                rm -rf "$dir"
              fi
            done
          else
            echo "Melewati kompresi, mengemas folder mentah..."
            cp -r ./downloads/game ./output_wua/
          fi

      - name: 6. Upload .WUA ke Rclone Destinasi
        run: |
          rclone copy ./output_wua "${{ inputs.rclone_dest }}" --progress --transfers 4

      - name: 7. Bersihkan Sisa File
        run: rm -rf ./output_wua downloads squashfs-root cemu WiiUDownloader
