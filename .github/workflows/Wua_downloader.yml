name: Download Wii U Game, Convert to WUA & Upload

on:
  workflow_dispatch:
    inputs:
      title_id:
        description: 'Masukkan Title ID Game (Contoh Shovel Knight: 000500001016E200)'
        required: true
        default: '000500001016E200'
        type: string
      rclone_dest:
        description: 'Destinasi Rclone (Contoh: gdrive:/GameWiiU atau mega:/Backup)'
        required: true
        type: string
      download_dlc_updates:
        description: 'Download Update & DLC sekaligus?'
        required: true
        type: boolean
        default: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Bebaskan Disk Space di GitHub Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: 2. Install Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip p7zip-full libegl1 libopengl0

      - name: 3. Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONF }}

      - name: 4. Download Game Wii U via NUSGet CLI
        run: |
          rm -rf downloads nusget_extracted
          mkdir -p ./downloads
          
          # Download & Ekstrak NUSGet Linux v1.5.3 resmi dari NinjaCheetah
          wget "https://github.com/NinjaCheetah/NUSGet/releases/download/v1.5.3/NUSGet-Linux-x86_64-bin.zip" -O nusget.zip
          unzip nusget.zip -d ./nusget_extracted
          
          # Cari lokasi file biner eksekusi NUSGet
          NUSGET_BIN=$(find ./nusget_extracted -type f -name "NUSGet" | head -n 1)
          chmod +x "$NUSGET_BIN"
          
          # Unduh dan dekripsi game langsung dari NUS
          "$NUSGET_BIN" --title "${{ inputs.title_id }}" --download --decrypt --output ./downloads

      - name: 5. Download Cemu Enhanced & Kompresi ke .WUA
        run: |
          rm -rf cemu_extracted squashfs-root cemu_enhanced
          mkdir -p ./output_wua
          
          # Download Cemu Enhanced AppImage pilihanmu
          wget "https://github.com/pkgforge-dev/Cemu-AppImage-Enhanced/releases/download/2.6-4%402026-02-01_1769935971/Cemu-2.6-4-anylinux-x86_64.AppImage" -O cemu_enhanced
          chmod +x cemu_enhanced
          
          # Ekstrak AppImage Cemu ke folder terpisah agar tidak bentrok
          ./cemu_enhanced --appimage-extract
          mv squashfs-root cemu_extracted
          
          # Proses kompresi setiap folder hasil unduhan menjadi file .wua
          for dir in ./downloads/*/; do
            if [ -d "$dir" ]; then
              dirname=$(basename "$dir")
              echo "Mengompres folder $dirname menjadi file .wua..."
              ./cemu_extracted/AppRun --compress-title "$dir" -o "./output_wua/${dirname}.wua"
              rm -rf "$dir"
            fi
          done

      - name: 6. Upload .WUA ke Rclone Destinasi
        run: |
          rclone copy ./output_wua "${{ inputs.rclone_dest }}" --progress --transfers 4

      - name: 7. Bersihkan Sisa File Runner
        run: rm -rf ./output_wua downloads nusget_extracted nusget.zip cemu_extracted cemu_enhanced squashfs-root
