name: Download Wii U Game, Convert to WUA & Upload

on:
  workflow_dispatch:
    inputs:
      title_id:
        description: 'Masukkan Title ID Game (Contoh Bayonetta 1: 0005000010173600)'
        required: true
        default: '0005000010173600'
        type: string
      rclone_dest:
        description: 'Destinasi Rclone (Contoh: gdrive:/GameWiiU atau mega:/Backup)'
        required: true
        type: string
      download_dlc_updates:
        description: 'Download Update & DLC sekaligus?'
        required: true
        type: boolean
        default: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Bebaskan Disk Space di GitHub Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: 2. Install Dependencies & Virtual Display
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip p7zip-full xvfb tar

      - name: 3. Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONF }}

      - name: 4. Download Game Wii U via Wii U Downloader
        run: |
          mkdir -p ./downloads
          EXTRA_FLAGS=""
          if [ "${{ inputs.download_dlc_updates }}" = "true" ]; then
            EXTRA_FLAGS="--dlc --update"
          fi
          
          # Download Wii U Downloader AppImage (ini downloader-nya, bukan Cemu)
          wget https://github.com/Xpl0itU/WiiUDownloader/releases/latest/download/WiiUDownloader-Linux-x86_64.AppImage -O wiiupc
          chmod +x wiiupc
          
          ./wiiupc --appimage-extract
          xvfb-run ./squashfs-root/AppRun -t "${{ inputs.title_id }}" -o ./downloads $EXTRA_FLAGS --decrypt

      - name: 5. Download Cemu Tarball & Kompres ke .WUA
        run: |
          mkdir -p ./output_wua
          
          # Download Cemu versi Linux dalam bentuk tar.xz resmi (jauh lebih stabil linknya)
          # Mengambil dari rilis stabil Cemu
          wget https://github.com/cemu-project/Cemu/releases/download/v2.2/Cemu-2.2-linux-x86_64.tar.xz -O cemu.tar.xz || wget https://github.com/cemu-project/Cemu/releases/download/v2.0/Cemu-2.0-linux-x86_64.tar.xz -O cemu.tar.xz || true
          
          if [ -f "cemu.tar.xz" ]; then
            tar -xf cemu.tar.xz
            # Temukan binary Cemu hasil ekstrak (biasanya di dalam folder Cemu-...)
            CEMU_BIN=$(find . -maxdepth 2 -type f -name "Cemu" | head -n 1)
            
            if [ -n "$CEMU_BIN" ]; then
              chmod +x "$CEMU_BIN"
              for dir in ./downloads/*/; do
                if [ -d "$dir" ]; then
                  dirname=$(basename "$dir")
                  echo "Mengompres folder $dirname menjadi .wua..."
                  "$CEMU_BIN" --compress-title "$dir" -o "./output_wua/${dirname}.wua"
                  rm -rf "$dir"
                fi
              done
            else
              echo "Error: Biner Cemu tidak ditemukan setelah ekstrak tarball!"
              exit 1
            fi
          else
            echo "Error: Gagal mendownload tarball Cemu!"
            exit 1
          fi

      - name: 6. Upload .WUA ke Rclone Destinasi
        run: |
          rclone copy ./output_wua "${{ inputs.rclone_dest }}" --progress --transfers 4

      - name: 7. Bersihkan Sisa File Runner
        run: rm -rf ./output_wua downloads squashfs-root cemu.tar.xz Cemu-* wiiupc
