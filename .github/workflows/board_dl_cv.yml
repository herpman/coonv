name: Download and Convert Media GIF/MP4

on:
  workflow_dispatch:
    inputs:
      FPS:
        description: 'FPS (e.g., source, 24)'
        required: false
        default: 'source'
      RESOLUTION:
        description: 'Resolution (e.g., source, 1280:-2)'
        required: false
        default: 'source'
      CRF:
        description: 'Constant Rate Factor'
        required: false
        default: '29.5'
      DEBLOCK:
        description: 'Deblock settings (e.g., 0:0)'
        required: false
        default: '0:0'
      RD:
        description: 'RD value'
        required: false
        default: '6'
      PSY_RD:
        description: 'Psy-RD value'
        required: false
        default: '1.00'
      AQ_MODE:
        description: 'AQ Mode (e.g., 2)'
        required: false
        default: '2'
      AQ_STRENGTH:
        description: 'AQ Strength'
        required: false
        default: '1.00'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Disable man-db auto-update
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate
          sudo dpkg-reconfigure man-db

      - name: Checkout
        uses: actions/checkout@v5

      - name: Read URLs and set matrix
        id: set-matrix
        run: |
          urls=$(cat yt_urls.txt | grep -v '^#' | awk NF | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix=$urls"
          echo "matrix=$urls" >> $GITHUB_OUTPUT

  convert:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        url: ${{fromJson(needs.prepare.outputs.matrix)}}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install python3, yt-dlp & Dependencies
        run: |
          sudo apt-get purge -y man-db
          sudo apt-get install -y nodejs npm jq python3 python3-pip p7zip-full
          pip install requests pillow opencv-python-headless beautifulsoup4
          curl -L "https://www.dropbox.com/scl/fi/bdioefcl1dce4zs7iqqr6/ffmpeg-release-amd64-static.tar.xz?rlkey=npbqixqrbarhmuymm4ps5em45&dl=1" -o "ffmpeg.tar.xz"
          tar -xf ffmpeg.tar.xz
          sudo mv ffmpeg-*-amd64-static/ffmpeg /usr/local/bin/
          sudo chmod +x /usr/local/bin/ffmpeg
          curl -L "https://github.com/ffbinaries/ffbinaries-prebuilt/releases/download/v6.1/ffprobe-6.1-linux-64.zip" -o "./ffprobe-6.1-linux-64.zip"
          7z x ./ffprobe-6.1-linux-64.zip || (sudo apt-get update && sudo apt-get install -y p7zip-full && 7z x ./ffprobe-6.1-linux-64.zip)
          sudo chmod +x ./ffprobe
          sudo mv ./ffprobe /usr/local/bin/ffprobe
          python -m pip install --upgrade pip
          python -m pip install -U "yt-dlp[default,curl-cffi]" yt-dlp-ejs --pre
          yt-dlp --update-to nightly
          yt-dlp --version

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONF }}

      - name: Smart Download Media (yt-dlp for YouTube, BeautifulSoup for Web/GIF)
        run: |
          WORK_ID="job_${{ strategy.job-index }}_$RANDOM"
          mkdir -p "input/$WORK_ID" "sub/$WORK_ID" "desc/$WORK_ID"
          URL="${{ matrix.url }}"
          EPOCH_TIME=$(date +%s)
          
          if [[ "$URL" != *"youtube.com"* && "$URL" != *"youtu.be"* ]]; then
            echo "Detected non-YouTube URL, using BeautifulSoup & Requests extraction..."
            python3 -c "
import os, requests, re, cv2
from bs4 import BeautifulSoup
from urllib.parse import urlparse, unquote

url = '$URL'
work_dir = 'input/$WORK_ID'
desc_dir = 'desc/$WORK_ID'
epoch = '$EPOCH_TIME'

headers = {
    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
    'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8'
}

try:
    resp = requests.get(url, headers=headers, timeout=20)
    soup = BeautifulSoup(resp.text, 'html.parser')
    
    media_url = None
    thumbnail_url = None

    video_tag = soup.find('video')
    if video_tag:
        if video_tag.get('src'):
            media_url = video_tag.get('src')
        elif video_tag.find('source'):
            media_url = video_tag.find('source').get('src')
        if video_tag.get('poster'):
            thumbnail_url = video_tag.get('poster')

    if not media_url:
        og_vid = soup.find('meta', property='og:video') or soup.find('meta', property='og:video:secure_url')
        if og_vid:
            media_url = og_vid.get('content')

    if not thumbnail_url:
        og_img = soup.find('meta', property='og:image')
        if og_img:
            thumbnail_url = og_img.get('content')

    if not media_url:
        matches = re.findall(r'https?://[^\s\"\'<>]+?\.(?:mp4|gif|webm|mov)', resp.text)
        valid_matches = [m for m in matches if not any(bad in m.lower() for bad in ['logo', 'icon', 'avatar', 'thumb'])]
        if valid_matches:
            media_url = valid_matches[0]

    if not media_url:
        media_url = url

    print(f'Target Media ditemukan: {media_url}')
    
    media_res = requests.get(media_url, headers=headers, timeout=30)
    ext = 'mp4'
    if '.gif' in media_url.lower() or '.gif' in url.lower():
        ext = 'gif'
    elif '.webm' in media_url.lower():
        ext = 'webm'

    filename = f'id-time-{epoch}.{ext}'
    filepath = os.path.join(work_dir, filename)
    with open(filepath, 'wb') as f:
        f.write(media_res.content)

    if os.path.exists(filepath) and os.path.getsize(filepath) > 1024:
        if ext in ['gif', 'mp4', 'webm']:
            cap = cv2.VideoCapture(filepath)
            success, frame = cap.read()
            cap.release()
            if success:
                cv2.imwrite(os.path.join(desc_dir, f'id-time-{epoch}.jpg'), frame)
        elif thumbnail_url:
            thumb_res = requests.get(thumbnail_url, headers=headers)
            with open(os.path.join(desc_dir, f'id-time-{epoch}.jpg'), 'wb') as tf:
                tf.write(thumb_res.content)
                
    print('Berhasil mengunduh media via BeautifulSoup!')
except Exception as e:
    print(f'Gagal memproses via BeautifulSoup: {e}')
"
          else:
            FILENAME_TEMPLATE="%(title).50s_id-%(id)s_time-%(epoch)s.%(ext)s"
            
            yt-dlp --js-runtimes node \
                   --extractor-args "youtube:player_client=web_embedded" \
                   --fragment-retries 5 --concurrent-fragments 1 \
                   --cookies youtube_cookies.txt \
                   --no-playlist -t sleep --restrict-filenames \
                   --hls-use-mpegts --no-abort-on-error \
                   -o "$FILENAME_TEMPLATE" \
                   -f "bv*[vcodec^=avc1]+ba/b / best" \
                   -P "input/$WORK_ID" "$URL" || true
            
            yt-dlp --js-runtimes node --fragment-retries 5 --concurrent-fragments 5 --cookies youtube_cookies.txt --no-playlist -t sleep --skip-download --restrict-filenames -o "$FILENAME_TEMPLATE" --write-sub --write-auto-sub --sub-lang en --convert-subs srt -P "sub/$WORK_ID" "$URL" || true
            
            yt-dlp --js-runtimes node --fragment-retries 5 --concurrent-fragments 5 --cookies youtube_cookies.txt --no-playlist -t sleep --skip-download --restrict-filenames -o "$FILENAME_TEMPLATE" --write-thumbnail --write-description --convert-thumbnails jpg -P "desc/$WORK_ID" "$URL" || true
            
            find "desc/$WORK_ID" -type f -name "*.description" -exec bash -c 'mv "$0" "${0%.description}.txt"' {} \;
          fi
          
          mv input/$WORK_ID/* input/ 2>/dev/null || true
          mv sub/$WORK_ID/* sub/ 2>/dev/null || true
          mv desc/$WORK_ID/* desc/ 2>/dev/null || true
          
          rclone copy ./sub HerpDrive:Here/YTout/sub || true
          rclone copy ./desc HerpDrive:Here/YTout/desc || true

      - name: Run conversion
        run: |
          mkdir -p scripts 
          rclone copy DBOX:scripts ./scripts
          chmod +x ./scripts/convert_media.sh
          ./scripts/convert_media.sh
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          FPS: ${{ github.event.inputs.FPS }}
          RESOLUTION: ${{ github.event.inputs.RESOLUTION }}
          CRF: ${{ github.event.inputs.CRF }}
          DEBLOCK: ${{ github.event.inputs.DEBLOCK }}
          RD: ${{ github.event.inputs.RD }}
          PSY_RD: ${{ github.event.inputs.PSY_RD }}
          AQ_MODE: ${{ github.event.inputs.AQ_MODE }}
          AQ_STRENGTH: ${{ github.event.inputs.AQ_STRENGTH }}
