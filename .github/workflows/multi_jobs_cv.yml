name: Smart Media Pipeline (Archive vs Direct Links)

on:
  workflow_dispatch:
    inputs:
      FPS:
        description: 'FPS (e.g., source, 24)'
        required: false
        default: 'source'
      RESOLUTION:
        description: 'Resolution (e.g., source, 1280:-2)'
        required: false
        default: 'source'
      CRF:
        description: 'Constant Rate Factor'
        required: false
        default: '29.5'
      DEBLOCK:
        description: 'Deblock settings (e.g., 0:0)'
        required: false
        default: '0:0'
      RD:
        description: 'RD value'
        required: false
        default: '6'
      PSY_RD:
        description: 'Psy-RD value'
        required: false
        default: '1.00'
      AQ_MODE:
        description: 'AQ Mode (e.g., 2)'
        required: false
        default: '2'
      AQ_STRENGTH:
        description: 'AQ Strength'
        required: false
        default: '1.00'

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      is_archive: ${{ steps.set-matrix.outputs.is_archive }}
    steps:
      - name: Disable man-db auto-update
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate
          sudo dpkg-reconfigure man-db

      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect Type & Generate Matrix
        id: set-matrix
        run: |
          sudo apt-get update
          sudo apt-get install -y jq p7zip-full unrar megatools
          
          mkdir -p raw_videos downloads_temp
          cd downloads_temp
          
          # Baca baris pertama yt_urls.txt
          FIRST_URL=$(grep -v '^#' ../yt_urls.txt | awk NF | head -n 1)
          
          # Download file pertama ke folder temporary
          if [[ "$FIRST_URL" =~ mega\.nz ]]; then
            megadl "$FIRST_URL" --path .
          elif [[ "$FIRST_URL" =~ pixeldrain\.com/u/([a-zA-Z0-9]+) ]]; then
            FILE_ID="${BASH_REMATCH[1]}"
            curl -L -O -J "https://pixeldrain.com/api/file/$FILE_ID"
          else
            curl -L -O -J "$FIRST_URL" || true
          fi
          
          # Cek file apa yang baru saja didownload
          IS_ARCHIVE_FILE=false
          for downloaded_file in *; do
            if [[ "$downloaded_file" =~ \.(zip|rar|7z|tar|gz|bz2|xz)$ ]]; then
              IS_ARCHIVE_FILE=true
              break
            fi
          done
          
          cd ..
          
          if [ "$IS_ARCHIVE_FILE" = true ]; then
            echo "is_archive=true" >> $GITHUB_OUTPUT
            echo "Detected Archive file! Extracting..."
            
            # Pindahkan file arsip ke root workspace untuk diekstrak
            mv downloads_temp/* .
            rm -rf downloads_temp
            
            for downloaded_file in *; do
              if [[ "$downloaded_file" =~ \.(zip|rar|7z|tar|gz|bz2|xz)$ ]]; then
                7z x "$downloaded_file" -o"extracted_temp" || unrar x "$downloaded_file" "extracted_temp" || true
                rm -f "$downloaded_file"
                
                find "extracted_temp" -type f \( -name "*.mp4" -o -name "*.mkv" -o -name "*.avi" -o -name "*.mov" -o -name "*.webm" -o -name "*.flv" -o -name "*.srt" -o -name "*.ass" \) -exec mv {} raw_videos/ \;
                rm -rf "extracted_temp"
              fi
            done
            
            # Buat Matrix JSON dari nama file hasil ekstrak
            files_json=$(find raw_videos -type f -maxdepth 1 \( -name "*.mp4" -o -name "*.mkv" -o -name "*.avi" -o -name "*.mov" -o -name "*.webm" -o -name "*.flv" \) -printf '%f\n' | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "matrix=$files_json" >> $GITHUB_OUTPUT
            
          else
            echo "is_archive=false" >> $GITHUB_OUTPUT
            echo "Detected Direct Video/YouTube links. Cleaning temp and generating URL matrix..."
            rm -rf downloads_temp raw_videos
            
            urls_json=$(grep -v '^#' yt_urls.txt | awk NF | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "matrix=$urls_json" >> $GITHUB_OUTPUT
          fi

      - name: Upload Raw Files Artifact (Only if Archive)
        if: steps.set-matrix.outputs.is_archive == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: raw-files-artifact
          path: raw_videos/
          retention-days: 1

  convert:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        item: ${{fromJson(needs.prepare-matrix.outputs.matrix)}}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONF }}

      - name: Download Artifact (If Archive Mode)
        if: needs.prepare-matrix.outputs.is_archive == 'true'
        uses: actions/download-artifact@v4
        with:
          name: raw-files-artifact
          path: raw_files

      - name: Process Media (Convert & Sync)
        run: |
          IS_ARCHIVE="${{ needs.prepare-matrix.outputs.is_archive }}"
          ITEM="${{ matrix.item }}"
          
          # Buat folder input, output, scripts, raw_videos, dan subtitles
          mkdir -p input output scripts raw_videos subtitles
          
          if [ "$IS_ARCHIVE" == "true" ]; then
            # Mode Arsip: Ambil file video dari artifact
            FILENAME="$ITEM"
            mv "raw_files/$FILENAME" "input/$FILENAME"
            
            base_name="${FILENAME%.*}"
            if [ -f "raw_files/$base_name.srt" ]; then
              mv "raw_files/$base_name.srt" "subtitles/"
            fi
            if [ -f "raw_files/$base_name.ass" ]; then
              mv "raw_files/$base_name.ass" "subtitles/"
            fi
          else
            # Mode Direct Link: Download langsung file videonya di runner masing-masing tanpa artifact
            TARGET_URL="$ITEM"
            echo "Downloading media from URL: $TARGET_URL"
            
            sudo apt-get update
            sudo apt-get install -y megatools
            
            if [[ "$TARGET_URL" =~ mega\.nz ]]; then
              megadl "$TARGET_URL" --path .
            elif [[ "$TARGET_URL" =~ pixeldrain\.com/u/([a-zA-Z0-9]+) ]]; then
              FILE_ID="${BASH_REMATCH[1]}"
              curl -L -O -J "https://pixeldrain.com/api/file/$FILE_ID"
            else
              sudo apt-get install -y nodejs npm python3 python3-pip
              python -m pip install -U "yt-dlp[default,curl-cffi]" yt-dlp-ejs --pre
              yt-dlp --update-to nightly
              
              FILENAME_TEMPLATE="%(title).50s_id-%(id)s.%(ext)s"
              yt-dlp --js-runtimes node \
                     --extractor-args "generic:impersonate;youtube:player_client=web_embedded" \
                     --cookies youtube_cookies.txt \
                     --no-playlist --restrict-filenames \
                     -o "$FILENAME_TEMPLATE" \
                     -f "bv*[vcodec^=avc1]+ba/b / best" \
                     -P "raw_videos" "$TARGET_URL" || true
            fi
            
            # Pindahkan file hasil download (video ke input/, subtitle ke subtitles/)
            for downloaded_file in *; do
              if [[ "$downloaded_file" =~ \.(mp4|mkv|avi|mov|webm|flv)$ ]]; then
                mv "$downloaded_file" input/
              elif [[ "$downloaded_file" =~ \.(srt|ass)$ ]]; then
                mv "$downloaded_file" subtitles/
              fi
            done
            if [ -d "raw_videos" ]; then
              mv raw_videos/*.{mp4,mkv,avi,mov,webm,flv} input/ 2>/dev/null || true
              mv raw_videos/*.{srt,ass} subtitles/ 2>/dev/null || true
              rmdir raw_videos 2>/dev/null || true
            fi
          fi
          
          # --- CEK, EKSTRAK, DAN KONVERSI SUBTITLE KE SRT (MENGGUNAKAN MKVTOOLNIX & FFMPEG) ---
          sudo apt-get install -y mkvtoolnix ffmpeg
          
          echo "Checking MKV subtitle tracks..."
          for video_file in input/*.mkv; do
            [ -e "$video_file" ] || continue
            
            FILENAME_WITH_PATH=$(basename "$video_file")
            BASE_NAME="${FILENAME_WITH_PATH%.mkv}"
            
            SUB_TRACK_INFO=$(mkvmerge -J "$video_file" | jq -r '.tracks[] | select(.type=="subtitles") | .id' | head -n 1)
            
            if [ -n "$SUB_TRACK_INFO" ] && [ "$SUB_TRACK_INFO" != "null" ]; then
              echo "Detected softsub track ID: $SUB_TRACK_INFO in $video_file. Extracting..."
              
              SUB_CODEC=$(mkvmerge -J "$video_file" | jq -r --argjson id "$SUB_TRACK_INFO" '.tracks[] | select(.id==$id) | .codec')
              
              EXT="srt"
              if [[ "$SUB_CODEC" =~ SubStationAlpha|ASS ]]; then
                EXT="ass"
              elif [[ "$SUB_CODEC" =~ SSA ]]; then
                EXT="ssa"
              elif [[ "$SUB_CODEC" =~ WEBVTT ]]; then
                EXT="vtt"
              fi
              
              # 1. Ekstrak format aslinya ke folder subtitles/
              mkvextract tracks "$video_file" "$SUB_TRACK_INFO:subtitles/$BASE_NAME.$EXT" || true
              
              # 2. Jika format aslinya bukan srt, otomatis buat duplikatnya dalam bentuk .srt pakai ffmpeg
              if [ "$EXT" != "srt" ] && [ -f "subtitles/$BASE_NAME.$EXT" ]; then
                echo "Converting $EXT subtitle to .srt format..."
                ffmpeg -i "subtitles/$BASE_NAME.$EXT" "subtitles/$BASE_NAME.srt" -y || true
              fi
            else
              echo "No softsub text track found in $video_file."
            fi
          done

          # --- TRANSFER SUBTITLE KE HERPDRIVE VIA RCLONE ---
          echo "Checking and transferring extracted subtitles to HerpDrive..."
          if find subtitles/ -maxdepth 1 \( -name "*.srt" -o -name "*.ass" -o -name "*.ssa" -o -name "*.vtt" \) | grep -q .; then
            rclone copy subtitles/ HerpDrive:Here/sub --include "*.{srt,ass,ssa,vtt}" -v
            echo "Subtitles successfully transferred to HerpDrive:Here/sub!"
          else
            echo "No subtitle files to upload."
          fi

          # Download dan jalankan script konversi dari Dropbox
          rclone copy DBOX:scripts ./scripts
          chmod +x ./scripts/convert_media.sh
          ./scripts/convert_media.sh
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          FPS: ${{ github.event.inputs.FPS }}
          RESOLUTION: ${{ github.event.inputs.RESOLUTION }}
          CRF: ${{ github.event.inputs.CRF }}
          DEBLOCK: ${{ github.event.inputs.DEBLOCK }}
          RD: ${{ github.event.inputs.RD }}
          PSY_RD: ${{ github.event.inputs.PSY_RD }}
          AQ_MODE: ${{ github.event.inputs.AQ_MODE }}
          AQ_STRENGTH: ${{ github.event.inputs.AQ_STRENGTH }}
