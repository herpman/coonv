name: Flexible Downloader & Rclone Transfer

on:
  workflow_dispatch:
    inputs:
      URL:
        description: 'URL File yang ingin di-download (atau isi urls.txt di repo)'
        required: false
        default: ''
        type: string
      DOWNLOADER:
        description: 'Pilih Tool Download'
        required: true
        default: 'aria2'
        type: choice
        options:
          - aria2
          - wget
          - curl
          - gdown
      EXTRACT:
        description: 'Ekstrak file jika berupa arsip (zip/tar/rar/dll)?'
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      RCLONE_DEST:
        description: 'Destinasi Rclone (Contoh: DBOX:backup atau GDrive:Media)'
        required: true
        default: 'SujaDrive:downloads'
        type: string

jobs:
  download-and-transfer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3 python3-pip aria2 wget curl p7zip-full unrar
          python -m pip install --upgrade pip
          python -m pip install gdown requests beautifulsoup4

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONF }}

      - name: Prepare Folders & Source URLs
        run: |
          # Buat dua folder terpisah: Folder A (downloads) & Folder B (ready_to_upload)
          rm -rf downloads ready_to_upload
          mkdir -p downloads ready_to_upload
          
          INPUT_URL="${{ github.event.inputs.URL }}"
          if [ -n "$INPUT_URL" ]; then
            echo "$INPUT_URL" > urls.txt
          fi

          if [ ! -f "urls.txt" ]; then
            echo "Error: urls.txt tidak ditemukan dan input URL kosong!"
            exit 1
          fi

          echo "Daftar URL yang akan diproses:"
          cat urls.txt

      - name: Download Files to Folder A
        run: |
          TOOL="${{ github.event.inputs.DOWNLOADER }}"
          
          cat << 'EOF' > get_mf.py
          import sys, requests, re
          from bs4 import BeautifulSoup

          url = sys.argv[1]
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          try:
              res = requests.get(url, headers=headers, timeout=15)
              soup = BeautifulSoup(res.text, 'html.parser')
              btn = soup.find('a', {'id': 'downloadButton'})
              if btn and 'href' in btn.attrs:
                  print(btn['href'])
              else:
                  links = re.findall(r'https?://download\d+\.mediafire\.com/[^\s\"\']+', res.text)
                  print(links[0] if links else '')
          except Exception:
              print('')
          EOF

          cd downloads

          while IFS= read -r URL || [ -n "$URL" ]; do
            [[ -z "$URL" || "$URL" =~ ^# ]] && continue
            
            URL=$(echo "$URL" | xargs)

            echo "---------------------------------------------------"
            echo "Memproses: $URL menggunakan $TOOL"
            echo "---------------------------------------------------"

            if [[ "$URL" == *"mediafire.com"* ]]; then
              echo "Mendeteksi link MediaFire, mengekstrak direct link..."
              DIRECT_URL=$(python3 ../get_mf.py "$URL")

              if [ -n "$DIRECT_URL" ]; then
                echo "Direct link berhasil didapatkan: $DIRECT_URL"
                URL="$DIRECT_URL"
              else
                echo "Peringatan: Gagal mendapatkan direct link otomatis, menggunakan URL mentah..."
              fi
            fi

            if [ "$TOOL" = "wget" ]; then
              wget --content-disposition --trust-server-names --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$URL"
            elif [ "$TOOL" = "curl" ]; then
              curl -L -O -J -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$URL"
            elif [ "$TOOL" = "aria2" ]; then
              aria2c --content-disposition=true --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64)" --header="Referer: https://www.mediafire.com/" "$URL"
            elif [ "$TOOL" = "gdown" ]; then
              gdown --fuzzy "$URL"
            fi

          done < ../urls.txt

          # Hapus file sampah/kontrol sisa unduhan di Folder A
          rm -f *.php *.html *.htm *.aria2

          cd ..
          rm -f get_mf.py
          echo "Isi Folder A (downloads) setelah diunduh:"
          ls -la downloads

      - name: Move All Files to Folder B (Ready to Upload)
        run: |
          echo "Memindahkan seluruh file hasil download ke Folder B..."
          
          # Pindahkan semua file (apapun jenis formatnya) kecuali file teks konfigurasi/urls
          find downloads -maxdepth 1 -type f ! -name "*.txt" -exec mv {} ready_to_upload/ \;

          echo "Isi Folder B (ready_to_upload):"
          ls -la ready_to_upload

      - name: Extract Archives in Folder B (If Enabled)
        if: ${{ github.event.inputs.EXTRACT == 'yes' }}
        run: |
          cd ready_to_upload
          echo "Memeriksa dan mengekstrak arsip file di Folder B..."
          
          for file in *; do
            if [ -f "$file" ]; then
              case "$file" in
                *.zip)
                  echo "Mengekstrak ZIP: $file"
                  unzip -o "$file" && rm -f "$file"
                  ;;
                *.rar)
                  echo "Mengekstrak RAR: $file"
                  unrar x -y "$file" && rm -f "$file"
                  ;;
                *.7z)
                  echo "Mengekstrak 7Z: $file"
                  7z x -y "$file" && rm -f "$file"
                  ;;
                *.tar.gz | *.tgz)
                  echo "Mengekstrak TAR.GZ: $file"
                  tar -xzf "$file" && rm -f "$file"
                  ;;
                *.tar.xz | *.txz)
                  echo "Mengekstrak TAR.XZ: $file"
                  tar -xJf "$file" && rm -f "$file"
                  ;;
                *.tar)
                  echo "Mengekstrak TAR: $file"
                  tar -xf "$file" && rm -f "$file"
                  ;;
                *)
                  echo "Bukan file arsip, biarkan utuh: $file"
                  ;;
              esac
            fi
          done
          
          cd ..
          echo "Isi akhir Folder B setelah ekstraksi (siap dikirim):"
          ls -la ready_to_upload

      - name: Transfer to Rclone Destination from Folder B
        run: |
          DEST="${{ github.event.inputs.RCLONE_DEST }}"
          echo "Mengirim semua isi Folder B ke Rclone destination: $DEST"
          
          # Rclone meng-upload seluruh isi Folder B apa adanya tanpa batasan ekstensi
          rclone copy ready_to_upload "$DEST" --progress --transfers=4 --checkers=4 --timeout=30m --contimeout=60s
          
          echo "Transfer selesai!"
