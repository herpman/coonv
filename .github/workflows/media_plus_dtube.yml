name: DTube Headless Browser & yt-dlp Pipeline

on:
  workflow_dispatch:
    inputs:
      FPS:
        description: 'FPS (e.g., source, 24)'
        required: false
        default: 'source'
      RESOLUTION:
        description: 'Resolution (e.g., source, 1280:-2)'
        required: false
        default: 'source'
      CRF:
        description: 'Constant Rate Factor'
        required: false
        default: '29.5'
      DEBLOCK:
        description: 'Deblock settings (e.g., 0:0)'
        required: false
        default: '0:0'
      RD:
        description: 'RD value'
        required: false
        default: '6'
      PSY_RD:
        description: 'Psy-RD value'
        required: false
        default: '1.00'
      AQ_MODE:
        description: 'AQ Mode (e.g., 2)'
        required: false
        default: '2'
      AQ_STRENGTH:
        description: 'AQ Strength'
        required: false
        default: '1.00'

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      is_archive: ${{ steps.set-matrix.outputs.is_archive }}
    steps:
      - name: Disable man-db auto-update
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate || true
          sudo dpkg-reconfigure man-db || true

      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate Custom Named Matrix
        id: set-matrix
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y jq python3 || true
          
          # Parsing file txt yang memiliki format: NamaFile | URL
          python3 -c "
          import json, re
          matrix_data = []
          with open('yt_urls.txt', 'r') as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  if '|' in line:
                      parts = line.split('|', 1)
                      custom_name = parts[0].strip()
                      url = parts[1].strip()
                      matrix_data.append({'name': custom_name, 'url': url})
                  else:
                      # Fallback jika baris hanya berisi URL murni
                      url = line
                      match = re.search(r'v=([a-zA-Z0-9-]+)', url)
                      fallback_name = match.group(1) if match else 'dtube_video'
                      matrix_data.append({'name': fallback_name, 'url': url})
                      
          print(f'Generated Matrix: {matrix_data}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out_file:
              out_file.write(f'is_archive=false\n')
              out_file.write(f'matrix={json.dumps(matrix_data)}\n')
          "
          python3 -c "import os" # Dummy import to ensure multiplatform safety

  convert:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        item: ${{fromJson(needs.prepare-matrix.outputs.matrix)}}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONF }}

      - name: Process Media (Sniff, Convert & Sync)
        run: |
          TARGET_URL="${{ matrix.item.url }}"
          CUSTOM_NAME="${{ matrix.item.name }}"
          
          echo "=========================================="
          echo "Processing Custom Name: $CUSTOM_NAME"
          echo "Target URL: $TARGET_URL"
          echo "=========================================="
          
          mkdir -p input output scripts raw_videos
          
          sudo apt-get update -y || true
          sudo apt-get install -y ffmpeg libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libdbus-1-3 libexpat1 libfontconfig1 libgbm1 libglib2.0-0 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext1 libxfixes1 libxi6 libxrandr2 libxrender1 libxss1 libxtst1 xdg-utils || true
          python3 -m pip install --upgrade pip || true
          python3 -m pip install -U "yt-dlp[default]" playwright requests || true
          python3 -m playwright install chromium || true
          
          python3 -c "
          import asyncio, subprocess, os, re
          from playwright.async_api import async_playwright
          
          async def run():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  page = await browser.new_page()
                  target_url = '$TARGET_URL'
                  captured_video = []
                  
                  def handle_request(request):
                      url = request.url
                      if any(ext in url for ext in ['.mp4', '.ts', '.m3u8', 'ipfs']) and 'googletagmanager' not in url:
                          if url not in captured_video:
                              captured_video.append(url)
                              print('Intercepted media URL:', url)
                              
                  page.on('request', handle_request)
                  try:
                      await page.goto(target_url, timeout=60000)
                      await page.wait_for_timeout(12000)
                  except Exception as e:
                      print('Error during page load:', e)
                  await browser.close()
                  
                  # Gunakan nama kustom yang di-passing dari matriks teks
                  raw_custom_name = '$CUSTOM_NAME'
                  safe_title = re.sub(r'[\/:*?\"<>|]', '', raw_custom_name).strip()
                  output_filename = f'{safe_title}.mp4'
                  print(f'Final Output Filename Set To: {output_filename}')
                  
                  if captured_video:
                      download_target = captured_video[0]
                      for v in captured_video:
                          if 'playlist.m3u8' in v:
                              download_target = v
                              break
                      print('Downloading stream via yt-dlp:', download_target)
                      try:
                          subprocess.run(['yt-dlp', download_target, '-o', output_filename], check=True)
                          print('Successfully downloaded stream.')
                      except Exception as ex:
                          print('yt-dlp process error:', ex)
          asyncio.run(run())
          "
          
          echo "Moving downloaded files into input/ folder..."
          for downloaded_file in *; do
            if [[ "$downloaded_file" =~ \.(mp4|mkv|avi|mov|webm|flv|ts|srt|ass)$ ]]; then
              mv "$downloaded_file" input/
              echo "Moved: $downloaded_file"
            fi
          done
          if [ -d "raw_videos" ]; then
            mv raw_videos/* input/ 2>/dev/null || true
            rmdir raw_videos 2>/dev/null || true
          fi
          
          rclone copy DBOX:scripts ./scripts
          chmod +x ./scripts/convert_media.sh
          ./scripts/convert_media.sh
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          FPS: ${{ github.event.inputs.FPS }}
          RESOLUTION: ${{ github.event.inputs.RESOLUTION }}
          CRF: ${{ github.event.inputs.CRF }}
          DEBLOCK: ${{ github.event.inputs.DEBLOCK }}
          RD: ${{ github.event.inputs.RD }}
          PSY_RD: ${{ github.event.inputs.PSY_RD }}
          AQ_MODE: ${{ github.event.inputs.AQ_MODE }}
          AQ_STRENGTH: ${{ github.event.inputs.AQ_STRENGTH }}
