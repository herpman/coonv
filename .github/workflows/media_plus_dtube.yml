name: Plus DTube Smart Media Pipeline (Archive vs Direct Links)

on:
  workflow_dispatch:
    inputs:
      FPS:
        description: 'FPS (e.g., source, 24)'
        required: false
        default: 'source'
      RESOLUTION:
        description: 'Resolution (e.g., source, 1280:-2)'
        required: false
        default: 'source'
      CRF:
        description: 'Constant Rate Factor'
        required: false
        default: '29.5'
      DEBLOCK:
        description: 'Deblock settings (e.g., 0:0)'
        required: false
        default: '0:0'
      RD:
        description: 'RD value'
        required: false
        default: '6'
      PSY_RD:
        description: 'Psy-RD value'
        required: false
        default: '1.00'
      AQ_MODE:
        description: 'AQ Mode (e.g., 2)'
        required: false
        default: '2'
      AQ_STRENGTH:
        description: 'AQ Strength'
        required: false
        default: '1.00'

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      is_archive: ${{ steps.set-matrix.outputs.is_archive }}
    steps:
      - name: Disable man-db auto-update
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate || true
          sudo dpkg-reconfigure man-db || true

      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect Type & Generate Matrix
        id: set-matrix
        run: |
          sudo apt-get install -y jq p7zip-full unrar megatools || true
          
          mkdir -p raw_videos downloads_temp
          cd downloads_temp
          
          FIRST_URL=$(grep -v '^#' ../yt_urls.txt | awk NF | head -n 1)
          
          if [[ "$FIRST_URL" =~ mega\.nz ]]; then
            megadl "$FIRST_URL" --path .
          elif [[ "$FIRST_URL" =~ pixeldrain\.com/u/([a-zA-Z0-9]+) ]]; then
            FILE_ID="${BASH_REMATCH[1]}"
            curl -L -O -J "https://pixeldrain.com/api/file/$FILE_ID"
          elif [[ "$FIRST_URL" =~ d\.tube ]]; then
            python3 -c "
            import urllib.request, re
            req = urllib.request.urlopen('$FIRST_URL')
            html = req.read().decode('utf-8')
            match = re.search(r'https?://[^\s\"<>]+?\.(mp4|m3u8)', html)
            if match:
                urllib.request.urlretrieve(match.group(0), 'dtube_file.mp4')
            " || true
          else
            curl -L -O -J "$FIRST_URL" || true
          fi
          
          IS_ARCHIVE_FILE=false
          for downloaded_file in *; do
            if [[ "$downloaded_file" =~ \.(zip|rar|7z|tar|gz|bz2|xz)$ ]]; then
              IS_ARCHIVE_FILE=true
              break
            fi
          done
          
          cd ..
          
          if [ "$IS_ARCHIVE_FILE" = true ]; then
            echo "is_archive=true" >> $GITHUB_OUTPUT
            echo "Detected Archive file! Extracting..."
            
            mv downloads_temp/* .
            rm -rf downloads_temp
            
            for downloaded_file in *; do
              if [[ "$downloaded_file" =~ \.(zip|rar|7z|tar|gz|bz2|xz)$ ]]; then
                7z x "$downloaded_file" -o"extracted_temp" || unrar x "$downloaded_file" "extracted_temp" || true
                rm -f "$downloaded_file"
                
                find "extracted_temp" -type f \( -name "*.mp4" -o -name "*.mkv" -o -name "*.avi" -o -name "*.mov" -o -name "*.webm" -o -name "*.flv" -o -name "*.srt" -o -name "*.ass" \) -exec mv {} raw_videos/ \;
                rm -rf "extracted_temp"
              fi
            done
            
            files_json=$(find raw_videos -type f -maxdepth 1 \( -name "*.mp4" -o -name "*.mkv" -o -name "*.avi" -o -name "*.mov" -o -name "*.webm" -o -name "*.flv" \) -printf '%f\n' | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "matrix=$files_json" >> $GITHUB_OUTPUT
            
          else
            echo "is_archive=false" >> $GITHUB_OUTPUT
            echo "Detected Direct Video/YouTube/DTube links. Cleaning temp and generating URL matrix..."
            rm -rf downloads_temp raw_videos
            
            urls_json=$(grep -v '^#' yt_urls.txt | awk NF | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "matrix=$urls_json" >> $GITHUB_OUTPUT
          fi

      - name: Upload Raw Files Artifact (Only if Archive)
        if: steps.set-matrix.outputs.is_archive == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: raw-files-artifact
          path: raw_videos/
          retention-days: 1

  convert:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        item: ${{fromJson(needs.prepare-matrix.outputs.matrix)}}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONF }}

      - name: Download Artifact (If Archive Mode)
        if: needs.prepare-matrix.outputs.is_archive == 'true'
        uses: actions/download-artifact@v4
        with:
          name: raw-files-artifact
          path: raw_files

      - name: Process Media (Convert & Sync)
        run: |
          IS_ARCHIVE="${{ needs.prepare-matrix.outputs.is_archive }}"
          ITEM="${{ matrix.item }}"
          
          mkdir -p input output scripts raw_videos
          
          if [ "$IS_ARCHIVE" == "true" ]; then
            FILENAME="$ITEM"
            mv "raw_files/$FILENAME" "input/$FILENAME"
            
            base_name="${FILENAME%.*}"
            if [ -f "raw_files/$base_name.srt" ]; then
              mv "raw_files/$base_name.srt" "input/"
            fi
            if [ -f "raw_files/$base_name.ass" ]; then
              mv "raw_files/$base_name.ass" "input/"
            fi
          else
            TARGET_URL="$ITEM"
            echo "Downloading media from URL: $TARGET_URL"
            
            if [[ "$TARGET_URL" =~ mega\.nz ]]; then
              megadl "$TARGET_URL" --path .
            elif [[ "$TARGET_URL" =~ pixeldrain\.com/u/([a-zA-Z0-9]+) ]]; then
              FILE_ID="${BASH_REMATCH[1]}"
              curl -L -O -J "https://pixeldrain.com/api/file/$FILE_ID"
            elif [[ "$TARGET_URL" =~ d\.tube ]]; then
              echo "Downloading DTube via Python script extraction..."
              python3 -c "
              import urllib.request, re, os
              url = '$TARGET_URL'
              headers = {'User-Agent': 'Mozilla/5.0'}
              req = urllib.request.Request(url, headers=headers)
              try:
                  html = urllib.request.urlopen(req).read().decode('utf-8')
                  match = re.search(r'https?://[^\s\"<>]+?\.(mp4|m3u8)', html)
                  if match:
                      stream_url = match.group(0)
                      print('Found stream:', stream_url)
                      urllib.request.urlretrieve(stream_url, 'dtube_video.mp4')
                  else:
                      print('Direct stream extension not found in HTML.')
              except Exception as e:
                  print('Error fetching DTube:', e)
              "
            else
              python3 -m pip install -U "yt-dlp[default,curl-cffi]" yt-dlp-ejs --pre || true
              yt-dlp --update-to nightly || true
              
              FILENAME_TEMPLATE="%(title).50s_id-%(id)s.%(ext)s"
              yt-dlp --js-runtimes node \
                     --extractor-args "generic:impersonate;youtube:player_client=web_embedded" \
                     --cookies youtube_cookies.txt \
                     --no-playlist --restrict-filenames \
                     -o "$FILENAME_TEMPLATE" \
                     -f "bv*[vcodec^=avc1]+ba/b / best" \
                     -P "raw_videos" "$TARGET_URL" || true
            fi
            
            for downloaded_file in *; do
              if [[ "$downloaded_file" =~ \.(mp4|mkv|avi|mov|webm|flv|srt|ass)$ ]]; then
                mv "$downloaded_file" input/
              fi
            done
            if [ -d "raw_videos" ]; then
              mv raw_videos/* input/ 2>/dev/null || true
              rmdir raw_videos 2>/dev/null || true
            fi
          fi
          
          rclone copy DBOX:scripts ./scripts
          chmod +x ./scripts/convert_media.sh
          ./scripts/convert_media.sh
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          FPS: ${{ github.event.inputs.FPS }}
          RESOLUTION: ${{ github.event.inputs.RESOLUTION }}
          CRF: ${{ github.event.inputs.CRF }}
          DEBLOCK: ${{ github.event.inputs.DEBLOCK }}
          RD: ${{ github.event.inputs.RD }}
          PSY_RD: ${{ github.event.inputs.PSY_RD }}
          AQ_MODE: ${{ github.event.inputs.AQ_MODE }}
          AQ_STRENGTH: ${{ github.event.inputs.AQ_STRENGTH }}
