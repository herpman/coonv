name: Rclone Decrypt & Upload Wii U to GDrive

on:
  workflow_dispatch:
    inputs:
      # Remote & Folder Input (Asal)
      rclone_input_remote:
        description: 'Nama Remote Rclone INPUT (contoh: gdrive)'
        required: true
        default: 'gdrive'
      gdrive_input_folder:
        description: 'Path folder MENTAH di GDrive'
        required: true
      
      # Remote & Folder Output (Tujuan)
      rclone_output_remote:
        description: 'Nama Remote Rclone OUTPUT (boleh beda/sama)'
        required: true
        default: 'gdrive'
      gdrive_output_folder:
        description: 'Path folder HASIL DEKRIPSI di GDrive'
        required: true

jobs:
  process-game:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONF }}

      - name: Install CDecrypt Binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev git
          
          git clone https://github.com/VitaSmith/cdecrypt.git
          cd cdecrypt
          make
          
          chmod +x cdecrypt
          sudo mv cdecrypt /usr/local/bin/

      - name: Buat Direktori Kerja
        run: |
          mkdir -p /tmp/game_raw
          mkdir -p /tmp/game_output

      - name: Download Folder Mentah dari Google Drive
        run: |
          REMOTE="${{ github.event.inputs.rclone_input_remote }}"
          FOLDER="${{ github.event.inputs.gdrive_input_folder }}"
          
          echo "Mengunduh dari remote: $REMOTE:$FOLDER"
          rclone copy "$REMOTE:$FOLDER" /tmp/game_raw --progress

      - name: Jalankan Proses Dekripsi CDecrypt
        run: |
          # Cari file title.tmd di dalam direktori /tmp/game_raw
          TMD_FILE=$(find /tmp/game_raw -name "title.tmd" | head -n 1)
          
          if [ -z "$TMD_FILE" ]; then
            echo "Error: file title.tmd tidak ditemukan!"
            exit 1
          fi
          
          DIR_NAME=$(dirname "$TMD_FILE")
          echo "File tmd ditemukan di: $DIR_NAME"
          
          # Pindah ke folder tempat tmd berada, lalu jalankan cdecrypt
          cd "$DIR_NAME"
          cdecrypt title.tmd
          
          # Pindahkan hasil (code, content, meta) ke folder /tmp/game_output secara pasti
          [ -d "code" ] && mv code /tmp/game_output/
          [ -d "content" ] && mv content /tmp/game_output/
          [ -d "meta" ] && mv meta /tmp/game_output/
          
          echo "Dekripsi selesai dan dipindahkan ke /tmp/game_output"

      - name: Upload Hasil Dekripsi ke Remote Tujuan
        run: |
          OUT_REMOTE="${{ github.event.inputs.rclone_output_remote }}"
          OUT_FOLDER="${{ github.event.inputs.gdrive_output_folder }}"
          
          echo "Mengunggah ke: $OUT_REMOTE:$OUT_FOLDER"
          rclone copy /tmp/game_output "$OUT_REMOTE:$OUT_FOLDER" --progress
