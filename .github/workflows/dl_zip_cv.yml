name: Download and Convert Media

on:
  workflow_dispatch:
    inputs:
      FPS:
        description: 'FPS (e.g., source, 24)'
        required: false
        default: 'source'
      RESOLUTION:
        description: 'Resolution (e.g., source, 1280:-2)'
        required: false
        default: 'source'
      CRF:
        description: 'Constant Rate Factor'
        required: false
        default: '29.5'
      DEBLOCK:
        description: 'Deblock settings (e.g., 0:0)'
        required: false
        default: '0:0'
      RD:
        description: 'RD value'
        required: false
        default: '6'
      PSY_RD:
        description: 'Psy-RD value'
        required: false
        default: '1.00'
      AQ_MODE:
        description: 'AQ Mode (e.g., 2)'
        required: false
        default: '2'
      AQ_STRENGTH:
        description: 'AQ Strength'
        required: false
        default: '1.00'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-requests p7zip-full unzip

      - name: Expand URLs and build parallel matrix
        id: set-matrix
        run: |
          python3 -c "
          import os, json, zipfile, requests, tempfile
          
          urls_file = 'yt_urls.txt'
          final_tasks = []
          
          if os.path.exists(urls_file):
              with open(urls_file, 'r', encoding='utf-8') as f:
                  lines = f.readlines()
              
              for line in lines:
                  url = line.strip()
                  if not url or url.startswith('#'):
                      continue
                  
                  if 'pixeldrain.com/u/' in url:
                      file_id = url.split('/u/')[-1].split('?')[0]
                      info_url = f'https://pixeldrain.com/api/file/{file_id}/info'
                      try:
                          res = requests.get(info_url, headers={'User-Agent': 'Mozilla/5.0'}, timeout=10)
                          if res.status_code == 200:
                              data = res.json()
                              filename = data.get('name', '')
                              ext = filename.split('.')[-1].lower() if '.' in filename else ''
                              
                              if ext in ['zip', 'rar', '7z', 'tar', 'gz', 'tgz']:
                                  print(f'Mengekspansi arsip Pixeldrain ke matrix: {filename}')
                                  api_dl = f'https://pixeldrain.com/api/file/{file_id}'
                                  
                                  with tempfile.TemporaryDirectory() as tmpdir:
                                      arc_path = os.path.join(tmpdir, filename)
                                      r = requests.get(api_dl, headers={'User-Agent': 'Mozilla/5.0'}, stream=True, timeout=30)
                                      with open(arc_path, 'wb') as wf:
                                          for chunk in r.iter_content(8192):
                                              wf.write(chunk)
                                      
                                      if ext == 'zip':
                                          with zipfile.ZipFile(arc_path, 'r') as zf:
                                              internal_files = zf.namelist()
                                      else:
                                          os.system(f'7z l \"{arc_path}\" -slt > \"{tmpdir}/list.txt\"')
                                          internal_files = []
                                          with open(f'{tmpdir}/list.txt', 'r', encoding='ignore', errors='ignore') as lf:
                                              for l in lf:
                                                  if l.startswith('Path = '):
                                                      p = l.split(' = ')[1].strip()
                                                      if p != filename: internal_files.append(p)
                                      
                                      for subfile in internal_files:
                                          if not subfile.endswith('/') and any(subfile.lower().endswith(e) for e in ['.mp4', '.mkv', '.avi', '.mov', '.webm', '.gif']):
                                              task_data = f'pixeldrain-sub__{file_id}__{subfile}'
                                              final_tasks.append(task_data)
                              else:
                                  final_tasks.append(url)
                          else:
                              final_tasks.append(url)
                      except Exception as e:
                          print(f'Gagal ekspansi pixeldrain: {e}')
                          final_tasks.append(url)
                  else:
                      final_tasks.append(url)
          
          final_tasks = list(dict.fromkeys(final_tasks))
          print('Final Matrix Tasks:', final_tasks)
          
          matrix_json = json.dumps(final_tasks)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'matrix={matrix_json}\n')
          "

  convert:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: ${{fromJson(needs.prepare.outputs.matrix)}}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Dependencies
        run: |
          sudo apt-get purge -y man-db
          sudo apt-get install -y nodejs npm jq python3 python3-pip p7zip-full unzip
          curl -L "https://www.dropbox.com/scl/fi/bdioefcl1dce4zs7iqqr6/ffmpeg-release-amd64-static.tar.xz?rlkey=npbqixqrbarhmuymm4ps5em45&dl=1" -o "ffmpeg.tar.xz"
          tar -xf ffmpeg.tar.xz
          sudo mv ffmpeg-*-amd64-static/ffmpeg /usr/local/bin/
          sudo chmod +x /usr/local/bin/ffmpeg
          curl -L "https://github.com/ffbinaries/ffbinaries-prebuilt/releases/download/v6.1/ffprobe-6.1-linux-64.zip" -o "./ffprobe-6.1-linux-64.zip"
          7z x ./ffprobe-6.1-linux-64.zip || (sudo apt-get update && sudo apt-get install -y p7zip-full && 7z x ./ffprobe-6.1-linux-64.zip)
          sudo chmod +x ./ffprobe
          sudo mv ./ffprobe /usr/local/bin/ffprobe
          python -m pip install --upgrade pip
          python -m pip install -U "yt-dlp[default,curl-cffi]" yt-dlp-ejs --pre requests pillow opencv-python-headless
          yt-dlp --update-to nightly

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONF }}

      - name: Process Individual Task (Parallel Matrix)
        run: |
          WORK_ID="job_${{ strategy.job-index }}_$RANDOM"
          mkdir -p "input/$WORK_ID" "sub/$WORK_ID" "desc/$WORK_ID"
          TASK="${{ matrix.task }}"
          EPOCH_TIME=$(date +%s)
          
          if [[ "$TASK" == "pixeldrain-sub__"* ]]; then
            echo "Detected sub-file extraction from Pixeldrain archive via Python handler..."
            export TASK_STRING="$TASK"
            export WORK_DIR="input/$WORK_ID"
            
            python3 -c "
            import os, zipfile, requests, shutil
            
            task_str = os.environ.get('TASK_STRING')
            work_dir = os.environ.get('WORK_DIR')
            
            parts = task_str.split('__')
            file_id = parts[1]
            sub_file = parts[2]
            
            api_url = f'https://pixeldrain.com/api/file/{file_id}'
            headers = {'User-Agent': 'Mozilla/5.0'}
            
            try:
                print(f'Downloading full archive to extract single file: {sub_file}')
                res = requests.get(api_url, headers=headers, stream=True, timeout=180)
                
                temp_arc = os.path.join(work_dir, 'temp_archive.zip')
                with open(temp_arc, 'wb') as f:
                    for chunk in res.iter_content(chunk_size=8192):
                        f.write(chunk)
                
                if zipfile.is_zipfile(temp_arc):
                    with zipfile.ZipFile(temp_arc, 'r') as zf:
                        zf.extract(sub_file, path=work_dir)
                        
                        extracted_path = os.path.join(work_dir, sub_file)
                        target_path = os.path.join(work_dir, os.path.basename(sub_file))
                        if extracted_path != target_path and os.path.exists(extracted_path):
                            shutil.move(extracted_path, target_path)
                else:
                    os.system(f'7z x \"{temp_arc}\" -o\"{work_dir}\" -y \"{sub_file}\"')
                
                if os.path.exists(temp_arc):
                    os.remove(temp_arc)
                print(f'Successfully extracted parallel task file: {sub_file}')
            except Exception as e:
                print(f'Error in sub_handler: {e}')
            "
            
          elif [[ "$TASK" == *"pixeldrain.com/u/"* ]]; then
            export TARGET_URL="$TASK"
            export WORK_DIR="input/$WORK_ID"
            export EPOCH_TIME="$EPOCH_TIME"
            python3 pixeldrain_handler.py
          else
            URL="$TASK"
            FILENAME_TEMPLATE="%(title).50s_id-%(id)s_time-%(epoch)s.%(ext)s"
            
            yt-dlp --js-runtimes node \
                   --extractor-args "generic:impersonate;youtube:player_client=web_embedded" \
                   --fragment-retries 5 --concurrent-fragments 1 \
                   --cookies youtube_cookies.txt \
                   --no-playlist -t sleep --restrict-filenames \
                   --hls-use-mpegts --no-abort-on-error \
                   -o "$FILENAME_TEMPLATE" \
                   -f "bv*[vcodec^=avc1]+ba/b / best" \
                   -P "input/$WORK_ID" "$URL" || true
            
            yt-dlp --js-runtimes node --fragment-retries 5 --concurrent-fragments 5 --cookies youtube_cookies.txt --no-playlist -t sleep --skip-download --restrict-filenames -o "$FILENAME_TEMPLATE" --write-sub --write-auto-sub --sub-lang en --convert-subs srt -P "sub/$WORK_ID" "$URL" || true
            
            yt-dlp --js-runtimes node --fragment-retries 5 --concurrent-fragments 5 --cookies youtube_cookies.txt --no-playlist -t sleep --skip-download --restrict-filenames -o "$FILENAME_TEMPLATE" --write-thumbnail --write-description --convert-thumbnails jpg -P "desc/$WORK_ID" "$URL" || true
            
            find "desc/$WORK_ID" -type f -name "*.description" -exec bash -c 'mv "$0" "${0%.description}.txt"' {} \;
          fi
          
          mv input/$WORK_ID/* input/ 2>/dev/null || true
          mv sub/$WORK_ID/* sub/ 2>/dev/null || true
          mv desc/$WORK_ID/* desc/ 2>/dev/null || true
          
          rclone copy ./sub HerpDrive:Here/YTout/sub || true
          rclone copy ./desc HerpDrive:Here/YTout/desc || true

      - name: Run conversion
        run: |
          mkdir -p scripts 
          rclone copy DBOX:scripts ./scripts
          chmod +x ./scripts/convert_media.sh
          ./scripts/convert_media.sh
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          FPS: ${{ github.event.inputs.FPS }}
          RESOLUTION: ${{ github.event.inputs.RESOLUTION }}
          CRF: ${{ github.event.inputs.CRF }}
          DEBLOCK: ${{ github.event.inputs.DEBLOCK }}
          RD: ${{ github.event.inputs.RD }}
          PSY_RD: ${{ github.event.inputs.PSY_RD }}
          AQ_MODE: ${{ github.event.inputs.AQ_MODE }}
          AQ_STRENGTH: ${{ github.event.inputs.AQ_STRENGTH }}
