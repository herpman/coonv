# Deteksi apakah URL adalah Pixeldrain
          if [[ "$URL" =~ pixeldrain\.com/u/([a-zA-Z0-9]+) ]]; then
            FILE_ID="${BASH_REMATCH[1]}"
            echo "Detected Pixeldrain link. Converting to direct API download..."
            URL="https://pixeldrain.com/api/file/$FILE_ID"
          fi

          # Deteksi apakah URL adalah file arsip langsung ATAU dari Pixeldrain (karena biasanya berupa zip/video)
          if [[ "$URL" =~ \.(zip|rar|7z|tar|gz|bz2|xz)$ ]] || [[ "$URL" =~ pixeldrain\.com/api/file/ ]]; then
            echo "Downloading file/archive from direct link..."
            ARCHIVE_NAME="downloaded_media_${RANDOM}.zip" # Default name, curl akan menyimpan sesuai file
            
            # Gunakan -O atau -J agar curl menyimpan dengan nama asli dari server
            curl -L -O -J "$URL"
            
            # Cari file yang baru saja di-download (bisa berupa arsip atau langsung video)
            # Lalu pindahkan atau ekstrak jika itu arsip
            for downloaded_file in *; do
              if [[ "$downloaded_file" =~ \.(zip|rar|7z|tar|gz|bz2|xz)$ ]]; then
                echo "Extracting archive: $downloaded_file"
                7z x "$downloaded_file" -o"input/$WORK_ID/extracted" || unrar x "$downloaded_file" "input/$WORK_ID/extracted" || true
                rm -f "$downloaded_file"
                
                find "input/$WORK_ID/extracted" -type f \( -name "*.mp4" -o -name "*.mkv" -o -name "*.avi" -o -name "*.mov" -o -name "*.webm" -o -name "*.flv" \) -exec mv {} "input/$WORK_ID/" \;
                rm -rf "input/$WORK_ID/extracted"
              elif [[ "$downloaded_file" =~ \.(mp4|mkv|avi|mov|webm|flv)$ ]]; then
                echo "Direct video file detected from Pixeldrain, moving to input..."
                mv "$downloaded_file" "input/$WORK_ID/"
              fi
            done
          
          else
            echo "Detected video link (YouTube/Streaming). Using yt-dlp..."
            # ... (kode yt-dlp tetap seperti sebelumnya) ...
          fi
