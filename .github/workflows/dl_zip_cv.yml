name: Download and Convert Media (Artifacts Matrix)

on:
  workflow_dispatch:
    inputs:
      FPS:
        description: 'FPS (e.g., source, 24)'
        required: false
        default: 'source'
      RESOLUTION:
        description: 'Resolution (e.g., source, 1280:-2)'
        required: false
        default: 'source'
      CRF:
        description: 'Constant Rate Factor'
        required: false
        default: '29.5'
      DEBLOCK:
        description: 'Deblock settings (e.g., 0:0)'
        required: false
        default: '0:0'
      RD:
        description: 'RD value'
        required: false
        default: '6'
      PSY_RD:
        description: 'Psy-RD value'
        required: false
        default: '1.00'
      AQ_MODE:
        description: 'AQ Mode (e.g., 2)'
        required: false
        default: '2'
      AQ_STRENGTH:
        description: 'AQ Strength'
        required: false
        default: '1.00'

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Disable man-db auto-update
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate
          sudo dpkg-reconfigure man-db

      - name: Checkout
        uses: actions/checkout@v5

      - name: Download, Extract & Upload Artifact
        id: set-matrix
        run: |
          sudo apt-get update
          sudo apt-get install -y jq p7zip-full unrar
          
          mkdir -p raw_videos
          
          # Baca link pertama dari yt_urls.txt
          URL=$(cat yt_urls.txt | grep -v '^#' | awk NF | head -n 1)
          
          # Deteksi Pixeldrain URL
          if [[ "$URL" =~ pixeldrain\.com/u/([a-zA-Z0-9]+) ]]; then
            FILE_ID="${BASH_REMATCH[1]}"
            echo "Detected Pixeldrain link. Converting to direct API download..."
            URL="https://pixeldrain.com/api/file/$FILE_ID"
          fi

          # Download arsip atau file langsung
          if [[ "$URL" =~ \.(zip|rar|7z|tar|gz|bz2|xz)$ ]] || [[ "$URL" =~ pixeldrain\.com/api/file/ ]]; then
            echo "Downloading archive..."
            curl -L -O -J "$URL"
            
            for downloaded_file in *; do
              if [[ "$downloaded_file" =~ \.(zip|rar|7z|tar|gz|bz2|xz)$ ]]; then
                echo "Extracting archive..."
                7z x "$downloaded_file" -o"extracted_temp" || unrar x "$downloaded_file" "extracted_temp" || true
                rm -f "$downloaded_file"
                
                # Pindahkan video ke raw_videos
                find "extracted_temp" -type f \( -name "*.mp4" -o -name "*.mkv" -o -name "*.avi" -o -name "*.mov" -o -name "*.webm" -o -name "*.flv" \) -exec mv {} raw_videos/ \;
                rm -rf "extracted_temp"
              elif [[ "$downloaded_file" =~ \.(mp4|mkv|avi|mov|webm|flv)$ ]]; then
                mv "$downloaded_file" raw_videos/
              fi
            done
          else
            # Jika itu link YouTube biasa, kita pakai yt-dlp
            sudo apt-get install -y nodejs npm python3 python3-pip
            python -m pip install -U "yt-dlp[default,curl-cffi]" yt-dlp-ejs --pre
            yt-dlp --update-to nightly
            
            FILENAME_TEMPLATE="%(title).50s_id-%(id)s.%(ext)s"
            yt-dlp --js-runtimes node \
                   --extractor-args "generic:impersonate;youtube:player_client=web_embedded" \
                   --cookies youtube_cookies.txt \
                   --no-playlist --restrict-filenames \
                   -o "$FILENAME_TEMPLATE" \
                   -f "bv*[vcodec^=avc1]+ba/b / best" \
                   -P "raw_videos" "$URL" || true
          fi

          # Buat JSON array daftar nama file untuk matrix GitHub Actions
          files_json=$(find raw_videos -type f -maxdepth 1 -printf '%f\n' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          
          echo "Generated Matrix: $files_json"
          echo "matrix=$files_json" >> $GITHUB_OUTPUT

      - name: Upload Raw Videos Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-videos-artifact
          path: raw_videos/
          retention-days: 1

  convert:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        filename: ${{fromJson(needs.prepare-matrix.outputs.matrix)}}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONF }}

      - name: Download Artifact & Run Conversion
        run: |
          mkdir -p input output scripts raw_videos
          
          # Download artifact video mentah yang diupload oleh job sebelumnya
          uses_artifact="true"
        # Menggunakan action bawaan untuk download artifact
        # (Dilanjutkan di step download artifact resmi di bawah)

      - name: Download Artifact Files
        uses: actions/download-artifact@v4
        with:
          name: raw-videos-artifact
          path: raw_videos

      - name: Move Specific File to Input & Run Script
        run: |
          # Ambil tepat 1 file milik runner matrix ini dan pindahkan ke folder input/
          mv "raw_videos/${{ matrix.filename }}" "input/${{ matrix.filename }}"
          
          # Download script konversi Anda dari Dropbox (script lama Anda tidak perlu diubah karena folder input/ hanya berisi 1 file ini)
          mkdir -p scripts
          rclone copy DBOX:scripts ./scripts
          chmod +x ./scripts/convert_media.sh
          ./scripts/convert_media.sh
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          FPS: ${{ github.event.inputs.FPS }}
          RESOLUTION: ${{ github.event.inputs.RESOLUTION }}
          CRF: ${{ github.event.inputs.CRF }}
          DEBLOCK: ${{ github.event.inputs.DEBLOCK }}
          RD: ${{ github.event.inputs.RD }}
          PSY_RD: ${{ github.event.inputs.PSY_RD }}
          AQ_MODE: ${{ github.event.inputs.AQ_MODE }}
          AQ_STRENGTH: ${{ github.event.inputs.AQ_STRENGTH }}
