name: Wii U Download, Extract and Upload to GDrive

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'Direct Download URL (e.g., Internet Archive .7z link)'
        required: true
        type: string
      gdrive_folder:
        description: 'Target Folder in Google Drive'
        required: true
        default: 'WiiU_Games'
        type: string

jobs:
  process-game:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Rclone
      uses: AnimMouse/setup-rclone-action@v1

    - name: Configure Rclone
      run: |
        mkdir -p ~/.config/rclone
        echo "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf

    - name: Free Up Maximum Disk Space
      run: |
        echo "Clearing pre-installed tools and Android/Java SDKs to maximize free disk space..."
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        echo "=== Current Free Disk Space ==="
        df -h /

    - name: Download Archive (With Cookie Auth)
      run: |
        echo "Downloading file from Internet Archive..."
        wget --header="Cookie: ${{ secrets.IA_COOKIE }}" -O game.7z "${{ github.event.inputs.download_url }}"
        echo "=== Disk Space After Download ==="
        df -h /

    - name: Extract Archive & Clean Up Immediately
      run: |
        echo "Extracting 7z file..."
        7z x game.7z -oextracted_game/
        
        echo "Removing 7z archive file to instantly reclaim storage..."
        rm game.7z
        
        echo "=== Disk Space After Extraction & Cleanup ==="
        df -h /

    - name: Upload Extracted Folder to Google Drive via Rclone
      run: |
        echo "Uploading extracted folder to Google Drive..."
        rclone copy extracted_game/ gdrive:"${{ github.event.inputs.gdrive_folder }}" --progress --transfers=4
