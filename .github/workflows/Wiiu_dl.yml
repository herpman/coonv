name: Wii U Download, Extract and Upload to GDrive

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'Direct Download URL (Internet Archive .7z link)'
        required: true
        type: string
      rclone_remote:
        description: 'Rclone Remote Name (e.g., mydrive, gdrive)'
        required: true
        default: 'gdrive'
        type: string
      gdrive_folder:
        description: 'Target Folder in Google Drive'
        required: true
        default: 'WiiU_Games'
        type: string

jobs:
  process-game:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Rclone
      uses: AnimMouse/setup-rclone@v1
      with:
        rclone_config: ${{ secrets.RCLONE_CONF }}

    - name: Free Up Maximum Disk Space
      run: |
        echo "Clearing pre-installed tools and SDKs to maximize free space..."
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        echo "=== Current Free Disk Space ==="
        df -h /

    - name: Download Archive with wget & Netscape Cookies
      run: |
        echo "Creating temporary Internet Archive cookies file..."
        echo "${{ secrets.IA_COOKIE }}" > ia_cookies.txt
        
        echo "Downloading file..."
        wget --load-cookies ia_cookies.txt -O game.7z "${{ github.event.inputs.download_url }}"
        
        echo "Cleaning up temporary cookie file..."
        rm ia_cookies.txt
        
        echo "=== Disk Space After Download ==="
        df -h /

    - name: Extract Archive & Clean Up Immediately
      run: |
        echo "Extracting 7z file..."
        7z x game.7z -oextracted_game/
        
        echo "Removing 7z archive file to instantly reclaim storage..."
        rm game.7z
        
        echo "=== Disk Space After Extraction & Cleanup ==="
        df -h /

    - name: Upload Extracted Folder to Google Drive via Rclone
      run: |
        echo "Uploading extracted folder to Google Drive using remote: ${{ github.event.inputs.rclone_remote }}"
        rclone copy extracted_game/ "${{ github.event.inputs.rclone_remote }}:${{ github.event.inputs.gdrive_folder }}" --progress --transfers=4
