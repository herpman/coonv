name: Wii U CLI Downloader & Rclone

on:
  workflow_dispatch:
    inputs:
      title_id:
        description: 'Title ID Wii U (Contoh: 000500001016E100)'
        required: true
        type: string
      rclone_remote:
        description: 'Nama Remote Rclone'
        required: true
        default: 'gdrive'
      rclone_destination:
        description: 'Folder tujuan di remote'
        required: true
        default: '/WiiU/Roms'

jobs:
  download-and-transfer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Setup Rclone menggunakan Action dari AnimMouse
      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONF }}

      - name: Download & Run NUS Downloader / Python CLI equivalent
        run: |
          # Menggunakan alat CLI alternatif yang mendukung Title ID langsung via terminal
          # Contoh menggunakan nusspli-python atau downloader NUS berbasis CLI
          pip install requests pycryptodome
          
          # Clone tool CLI pihak ketiga yang kompatibel dengan NUS server Nintendo
          git clone https://github.com/Xpl0itU/WiiUDownloader.git
          cd WiiUDownloader
          
          # Jika Anda ingin melihat struktur file aslinya
          python3 -m pip install --upgrade pip
          
          # Jalankan perintah download (sesuaikan parameter dengan fungsi skrip CLI)
          python3 WiiUDownloader.py --title-id "${{ inputs.title_id }}" --out ./output || python3 main.py --title-id "${{ inputs.title_id }}"
        env:
          TITLE_ID: "${{ inputs.title_id }}"

      - name: Transfer to Remote via Rclone
        run: |
          rclone copy ./WiiUDownloader/output "${{ inputs.rclone_remote }}:${{ inputs.rclone_destination }}" --progress --transfers 4

      - name: Clean up
        if: always()
        run: |
          rm -rf WiiUDownloader/output
